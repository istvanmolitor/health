{% extends 'healthlog/base.html' %}

{% block content %}
<h2>Bejelentkezés</h2>
{% if form.errors %}
<p style="color: #b00020;">Hibás felhasználónév vagy jelszó.</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Bejelentkezés</button>
</form>
<p><a href="{% url 'healthlog:register' %}">Regisztráció</a></p>
{% endblock %}
